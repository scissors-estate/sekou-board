<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施工ダッシュボード</title>
<script>
/* スマホ表示の確認用：URL に ?phone を付けると、暗い背景の真ん中にスマホ幅（390×844）の枠で開く */
(function(){
  if(!/[?&]phone\b/.test(location.search) || window.top !== window) return;
  var src = location.pathname + '?r=' + Date.now() + location.hash;
  window.stop();   // この先（本体）は読み込まず、枠だけにする
  document.documentElement.innerHTML = ('<head><meta charset="utf-8"><title>スマホ表示｜統合アプリ 試作</title><style>'
    + 'html,body{margin:0;height:100%;background:#14171d;font-family:system-ui,sans-serif}'
    + '.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box}'
    + '.bar{color:#9aa3b2;font-size:12px;display:flex;gap:12px;align-items:center}.bar a{color:#ffd34d;text-decoration:none}'
    + 'iframe{width:390px;height:min(844px,calc(100vh - 56px));border:1px solid #2c323d;border-radius:22px;background:#fff}'
    + '</style></head><body><div class="wrap"><div class="bar">スマホ表示（390×844）<a href="' + location.pathname + location.hash + '">PCで開く</a></div>'
    + '<iframe src="' + src + '"></iframe></div></body>');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  清掃ログ・施工管理・行動管理を1つのアプリにまとめる試作（プレシステム）2026-11-12 第2版
  - 清掃ログ・施工管理：今ある画面をそのまま、メニューの下に並べる（デザインだけ統一）
  - 行動管理：Asana型のボード（日ごとの列を横スクロール／メンバー×日）
  - 本番データは「読むだけ」：施工管理（GAS action=all）と空室フィード（Firebase cleaning_calendar）
  - 清掃ログの中身（報告・写真・リネン等）はログインが必要なので、試作では画面の形だけ
  - 行動管理で追加・移動した予定は、このブラウザ（localStorage）にだけ保存。本番には一切送らない
-->
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e5e8; --text:#1e1f21; --sub:#6d6e6f; --accent:#4573d2; --navy:#1e2a44;
  --clean:#4573d2; --sekou:#f06a38; --teiki:#2a9d6f; --check:#8e5bd8; --other:#8a8f98; --naikin:#0e9aa7;
  --free:#1f3b70; --inb:#c9d3e3; --today:#fff6d6; --warn:#d1373b; --ok:#2a9d6f;
  --side-bg:#0c2837; --side-hl:#85c6e6; --side-on:rgba(133,198,230,.18);   /* 左カラム：緑寄りの青（2026-11-13） */
  --side:248px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 "Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
b,strong,h1,h2,h3,th{font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit}

/* ===== 骨組み：左カラム＋右の本体 ===== */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:0 0 var(--side);background:var(--side-bg);color:#dfe5f2;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin .2s}
.app.collapsed .side{margin-left:calc(-1 * var(--side))}
.brand{padding:16px 16px 12px;display:flex;align-items:center;gap:8px}
.brand img{display:block;width:200px;height:auto;max-width:100%}
.brand b{font-size:15px;color:#fff}
.proto{background:#ffd34d;color:#3a2b00;font-size:12px;padding:1px 7px;border-radius:10px;font-weight:600}
.grp{border-top:1px solid rgba(255,255,255,.08)}
.grp>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;color:#fff;font-weight:600;padding:11px 16px;text-align:left}
.grp>button .ic{width:22px;text-align:center}
.grp>button .ar{margin-left:auto;font-size:12px;opacity:.6;transition:transform .2s}
.grp.open>button .ar{transform:rotate(90deg)}
.grp ul{list-style:none;margin:0;padding:0 0 8px;display:none}
.grp.open ul{display:block}
.grp li a{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 46px;color:#c6cfe2;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.grp li a:hover{background:rgba(255,255,255,.05)}
.grp li a.on{background:var(--side-on);color:#fff;border-left-color:var(--side-hl);font-weight:600}
.grp li a .need{margin-left:auto;font-size:10px;opacity:.6}
.side .foot{padding:12px 16px;font-size:12px;color:#9aa6c0;border-top:1px solid rgba(255,255,255,.08)}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:50px}
.top .ham{border:0;background:none;font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.top .ham:hover{background:#f0f1f3}
.crumb{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.crumb .app-n{color:var(--sub);font-weight:500}
.crumb .sep{color:#bbb}
.top .src{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.top .lang{margin-left:4px;border:1px solid var(--line);background:#f4f7fb;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;cursor:pointer}
.top .lang:hover{background:#e8eef7}
.subtabs{display:flex;gap:4px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs a{padding:9px 12px;border-bottom:3px solid transparent;color:var(--sub);text-decoration:none;font-weight:600;white-space:nowrap;font-size:14px}
.subtabs a.on{color:var(--text);border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
main{flex:1;min-width:0}
.page{padding:14px;max-width:1100px}
.page.wide{max-width:none}
.status{padding:30px;text-align:center;color:var(--sub)}
.status.err{color:var(--warn)}
.mask-side{display:none}

/* ===== 共通部品 ===== */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:14px;color:var(--sub);white-space:nowrap}
.chip.on{background:#e8eefb;border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.box>h2{margin:0;font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fafbfc}
.box>h2 .r{margin-left:auto;font-size:13px;color:var(--sub);font-weight:500}
.box .in{padding:10px 12px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid #f1f2f4}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:#f1f1f1;color:#555;margin:1px 3px 1px 0;white-space:nowrap}
.badge.warn{background:#fbe0e0;color:#9b2c2c} .badge.soon{background:#fff0c2;color:#7a5600} .badge.ok{background:#e1f4ec;color:#1d6b4b}
.badge.sekou{background:#fde7de;color:#9c3a12} .badge.teiki{background:#e1f4ec;color:#1d6b4b} .badge.in{background:#fff0c2;color:#7a5600} .badge.ext{background:#e7e0f7;color:#5b3aa6}
.badge.date{background:#e3e9f7;color:#203a74}
.av{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#dfe6f5;color:#2b3d66;font-size:12px;font-weight:600}
.av.none{background:#f6e3e3;color:#9b2c2c}
.muted{color:var(--sub);font-size:13px}
.bar{height:6px;border-radius:3px;background:#eceef1;overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.band{display:inline-block;font-style:normal;font-size:10px;padding:0 5px;border-radius:3px;margin-right:3px}
.band.free{background:var(--free);color:#fff} .band.inb{background:var(--inb);color:#24324d}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.mock{border:2px dashed #cfd6e4;border-radius:10px;padding:16px;background:#fbfcfe}
.mock h3{margin:0 0 6px;font-size:15px}
.mock ul{margin:6px 0 0;padding-left:20px;color:#3d4250}
.notice{background:#fff8e1;border:1px solid #f2dfa3;color:#6b5200;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* ===== 清掃ログ：報告 ===== */
.form label.l{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
.rbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-width:64px}
.rbtns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.drop{border:2px dashed #cfd6e4;border-radius:10px;padding:22px;text-align:center;color:var(--sub);background:#fbfcfe}
.chk{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.chk button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 12px;font-size:13px}
.chk button.on{background:#e1f4ec;border-color:#9ad3b9;color:#1d6b4b;font-weight:600}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;margin-bottom:6px;font-size:14px}
.rrow.free{display:block}
.tg{border:0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;color:#fff;min-width:78px;cursor:pointer}
.tg.ok{background:#16a34a}.tg.ng{background:#dc2626}.tg.warn{background:#d97706}
.cnt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);flex:none;white-space:nowrap}
.tg{flex:none}
.cnt button{width:34px;height:34px;border:1px solid var(--line);background:#eef2f8;border-radius:8px;font-size:16px;cursor:pointer}
.cnt b{min-width:22px;text-align:center;font-size:15px;color:var(--ink,#1f2430)}
.rnote{color:#dc2626;font-size:12px;font-weight:600;margin:2px 2px 6px}
.rin{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#eef2f8;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;margin-bottom:6px}
.rrow .rin{margin:0;flex:1}
.kc{display:flex;align-items:center;gap:8px;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;border:1px solid}
.kc b{font-size:13px}.kc code{font-size:14px;letter-spacing:2px}.kc span{font-weight:600;font-size:14px}
.kc.ent{background:#eaf1fb;border-color:#cfdcf2;color:#5b8fd6}
.kc.box{background:#e6f4ee;border-color:#c5e5d5;color:#2f9e6a}
.kc.post{background:#fbeee6;border-color:#f2d3bf;color:#c2410c}
.kcnote{font-size:12px;color:var(--sub);margin:-2px 0 8px}
.staffrow{display:flex;gap:8px;align-items:stretch}
.staffbox{flex:1;background:#eef2f8;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.addbtn{border:1px dashed var(--accent);color:var(--accent);background:#fff;border-radius:8px;padding:0 14px;font-weight:600;white-space:nowrap;cursor:pointer}
.stafflist{border:1px solid var(--line);border-radius:8px;max-height:45vh;overflow:auto;padding:0 10px}
.stafflist label{display:flex!important;align-items:center;gap:10px;margin:0!important;padding:10px 4px;border-bottom:1px solid #eef0f3;font-size:14px!important;color:var(--text)!important;cursor:pointer}
.stafflist label:last-child{border-bottom:0}
.stafflist input{width:18px!important;height:18px}
.stafflist span{flex:1}
.role{font-style:normal;font-size:12px;font-weight:600;border-radius:10px;padding:2px 10px}
.role.admin{background:#fdebd8;color:#c2410c}.role.checker{background:#dbe8fc;color:#1d4ed8}.role.manager{background:#efe4fb;color:#7e3fc0}.role.cleaner{background:#dcf3e5;color:#15803d}
.report{white-space:pre-wrap;font-size:13px;background:#f7f8fa;border-radius:8px;padding:10px;border:1px solid var(--line)}

/* ===== 清掃ログ：通知 ===== */
.ntabs{display:flex;gap:8px;margin:6px 0 16px}
.ntabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 18px;font-weight:500;color:#475569}
.ntabs button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.ntabs i{font-style:normal;background:#dc2626;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.nempty{text-align:center;color:var(--sub);padding:40px 0;font-size:16px}
.nitem{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.nitem.un{border-left:4px solid #2563eb}
.nitem:hover{border-color:var(--accent)}
.nic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.nic.ok{background:#dcfce7}.nic.ng{background:#fee2e2}
.nitem .nt{font-weight:500}.nitem .ns{font-size:14px;color:#334155;margin-top:2px}.nitem .nm{font-size:12px;color:var(--sub);margin-top:4px}
.nitem.un .nt{font-weight:600}
/* ===== 清掃ログ：管理（データ管理） ===== */
.admsec{display:flex;align-items:center;gap:12px;color:#2563eb;font-weight:600;font-size:15px;margin:22px 0 12px}
.admsec::before,.admsec::after{content:'';flex:1;height:1px;background:#d5deec}
.admstat{background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center;padding:18px 10px;margin-bottom:12px}
.admstat b{display:block;font-size:28px;font-weight:500;color:#94a3b8}.admstat span{font-size:13px;color:var(--sub)}
.admlbl{font-weight:600;color:#475569;margin-bottom:6px}
.admf{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);font-weight:500}.admf .rin{margin:0;background:#fff}
.admbar{display:flex;justify-content:space-between;font-weight:600;color:#475569}
.admtrack{height:10px;border-radius:5px;background:#eef2f8;margin:8px 0}
.admsite{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#eef2f8;border-radius:10px;padding:4px;margin-bottom:10px}
.admsite button{border:0;background:none;border-radius:8px;padding:9px;font-weight:600;color:#475569}
.admsite button.on{background:#003580;color:#fff}
.admok{background:#ecfdf3;border:1px solid #b7ebcb;color:#15803d;border-radius:8px;padding:9px 12px;font-weight:500;font-size:14px;margin-bottom:10px}
.bigbtn.admest{background:#dbe8fc;border-color:#2563eb;color:#1d4ed8}
.bigbtn.navy{background:#003580;border-color:#003580;color:#fff}
.admres{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:14px}
.nic.star{background:#fef3c7}
/* ===== 満点評価レビューの詳細カード ===== */
.rvc{border:1px solid;border-radius:14px;overflow:hidden;margin-bottom:12px}
.rvc.ab{border-color:#fdbba8}.rvc.bk{border-color:#a9bfe3}
.rvh{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;padding:10px 14px}
.rvc.ab .rvh{background:linear-gradient(90deg,#ff5a5f,#ff8a5c)}.rvc.bk .rvh{background:linear-gradient(90deg,#003580,#0a4bb3)}
.rvh em{font-style:normal;font-size:13px;background:rgba(255,255,255,.25);border-radius:14px;padding:2px 10px}
.rvb{display:flex;align-items:center;gap:18px;padding:14px 16px}
.rvs{text-align:center;padding-right:18px;border-right:3px solid;min-width:110px}
.rvc.ab .rvs{border-color:#fdd2c4}.rvc.bk .rvs{border-color:#c9d8f2}
.rvs .stars{color:#f5a623;font-size:26px;letter-spacing:1px;line-height:1.1}.rvs .ten{font-size:40px;font-weight:600;color:#003580;line-height:1}
.rvs small{font-size:12px;color:var(--sub);font-weight:500}
.rvp .pl{font-size:24px;font-weight:600}.rvp .pl b{color:#2563eb;font-family:ui-monospace,monospace}
.rvp .cd{font-weight:500;font-size:14px;margin-top:4px}
.rvm{border-top:1px dashed #d5deec;margin:0 16px;padding:12px 0 14px;color:#166534;font-weight:500;line-height:1.7}
.rvsent{display:inline-block;background:#dcfce7;border:1px solid #86efac;color:#15803d;border-radius:14px;padding:2px 10px;font-size:13px;font-weight:500}
.rvsent.no{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.rvmeta{font-size:13px;color:var(--sub);line-height:2;margin-top:6px}
.rvdel{border-color:#dc2626}
/* ===== 清掃ログ：リネン（需要予測） ===== */
.lnhead{background:#2563eb;color:#fff;border-radius:10px;text-align:center;padding:10px;font-weight:600;margin-bottom:10px}
.lnmode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#eef2f8;border-radius:10px;padding:3px}
.lnmode button{border:0;background:none;border-radius:8px;padding:7px;font-weight:500;color:#475569;font-size:14px;line-height:1.35}
.lnmode button small{display:block;font-size:13px}
.lnmode button.on{background:#2563eb;color:#fff}
.lndesc{text-align:center;font-size:13px;color:var(--sub);margin:8px 0}
.lnwarn{background:#fdf3e4;border:1px solid #f3d6a8;color:#b45309;border-radius:8px;text-align:center;font-size:13px;padding:6px;margin-bottom:10px}
.lnnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;text-align:center}
.lnnav .btn{padding:8px 14px}.lnnav b{font-size:16px;font-weight:600}.lnnav small{display:block;font-size:12px;color:var(--sub)}
.lnthis{display:block;width:100%;border:1px solid #2563eb;background:#fff;color:#2563eb;border-radius:8px;padding:7px;font-weight:500;margin-bottom:12px}
.lnthis.on{background:#dbe8fc}
.lndrop{border:1px solid #2563eb;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#f5f8fd}
.lndh{background:#dbe8fc;padding:14px 18px}.lndh h2{margin:0 0 4px;color:#1d4ed8;font-size:20px;font-weight:600}
.lnin{padding:12px 14px}
.lnok{background:#e1f4ec;border:1px solid #a7dcc2;color:#15803d;border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:500;margin-bottom:12px}
.lnfac{margin-bottom:12px}
.lnfh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.lnfh>b{font-weight:600}.lnfh .muted{margin-left:auto}
.lnchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #86efac;background:#dcfce7;color:#15803d;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:500;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lnchip i{display:inline-block;width:1px;height:14px;background:#86efac}
.lntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lnt{background:linear-gradient(#eef2f8 50%,#c9dbf8);border-radius:8px;text-align:center;padding:6px 4px}
.lnt span{display:block;font-size:12px;color:#475569}.lnt b{font-size:22px;font-weight:600;color:#94a3b8}
.lntotal{background:#e1f2ea;border:1px solid #b5e2c9;border-radius:10px;padding:10px 12px;margin-top:6px}
.lntotal .lnfh b{color:#15803d}
.lntiles.g .lnt{background:linear-gradient(#d4ebe1 50%,#b4dcc6)}.lntiles.g .lnt span{color:#15803d}

/* ===================== 小道具 ===================== */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = v => JSON.stringify(v).replace(/"/g,'&quot;');   // onclick 属性に値を埋めるとき
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const WD = ['日','月','火','水','木','金','土'];
const wd = s => new Date(s+'T00:00:00').getDay();
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const md = s => isYmd(s) ? `${+s.slice(5,7)}/${+s.slice(8,10)}` : String(s||'');   // 「日付不明」などはそのまま
const dkey = s => isYmd(s) ? s : '0000-00-00';                                       // 並べ替え用（日付不明は一番古い扱い）
const mdw = s => `${md(s)}（${WD[wd(s)]}）`;
const splitPeople = s => String(s||'').split(/[・、,，\s]+/).map(x=>x.trim()).filter(Boolean);
const uniq = a => [...new Set(a)];
const isSP = () => window.matchMedia('(max-width:820px)').matches;

/* ===================== 保存（このブラウザだけ） ===================== */
let store = {local:[], ov:{}, members:null, me:''};
try { const s = JSON.parse(localStorage.getItem(STORE)||'null'); if(s) store = Object.assign(store, s); } catch(e){}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(store)); } catch(e){} }

// 英語にするのは清掃スタッフが使う画面（メニュー・清掃ログ）。施工管理・行動管理の中身と、Chatworkに貼る報告文は日本語のまま
let LANG = store.lang === 'en' ? 'en' : 'ja';
const T = (ja, en) => LANG === 'en' ? en : ja;
document.documentElement.lang = LANG;
const nm = x => (LANG === 'en' && x.en) ? x.en : x.name;
function setLang(l){
  LANG = l || (LANG === 'en' ? 'ja' : 'en'); store.lang = LANG; save();
  document.documentElement.lang = LANG;
  render();
}

/* ===================== 状態 ===================== */
const ui = { app:'home', page:'dash', tab:'', mode:'day', who:'', day:today(), ref:false, fac:'', q:'', vm:today().slice(0,7), vfac:'', vleg:true, v0:false, vng:false,
  open:{home:true, sekou:true, act:true},
  kinds:{clean:true,sekou:true,teiki:true,check:true,naikin:true,other:true},
  rep:{fac:'', room:'', when:'before', chk:{}, trash:0, towel:0, lost:false, lostText:'', extra:[], dmg:false, dmgText:'', other:''} };
let D = null, V = null, RANGE = [], ROOMMAP = {};

/* ===================== 読み込み（GETだけ） ===================== */
const feedGet = p => fetch(VAC_FEED+p, {cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('空室フィード '+r.status); return r.json(); });
async function load(){
  const t = today();
  RANGE = Array.from({length:DAYS_BEFORE+DAYS_AFTER+1}, (_,i)=>addDays(t, i-DAYS_BEFORE));
  const months = uniq(RANGE.map(d=>d.slice(0,7)).concat([addDays(t,60).slice(0,7)]));
  const gas = fetch(GAS_URL+'?action=all&t='+Date.now()).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error('施工管理の読み込みに失敗'); return j.data; });
  const [data, rooms, meta, ...mds] = await Promise.all([gas, feedGet('/_rooms.json'), feedGet('/_meta.json'), ...months.map(m=>feedGet('/'+m+'.json'))]);
  D = data; V = {rooms:rooms||{}, meta:meta||{}, months:{}};
  months.forEach((m,i)=> V.months[m] = mds[i]||{});
  buildRoomMap(); applyEdits();
  document.getElementById('src').innerHTML = `予約・清掃予定 ${esc((meta&&meta.updatedAtText)||'?')} 時点<br>施工管理 ${esc(data.serverTime||'')} 読込`;
}
async function ensureMonth(m){
  if(V.months[m]) return;
  try { V.months[m] = await feedGet('/'+m+'.json') || {}; } catch(e){ V.months[m] = {}; }
}
function guestRooms(){ return (D.rooms||[]).filter(r=>r.room!=='事務所'); }
function buildRoomMap(){
  ROOMMAP = {};
  Object.keys(V.rooms).forEach(tag=>{
    const info = V.rooms[tag], fac = VAC_FAC[info.building];
    if(!fac){ ROOMMAP[tag] = {facility:info.building||tag, room:tag.replace(new RegExp('^'+(info.building||'')),'')||'-', ext:true, daiko:!!info.daiko, order:999}; return; }
    const gr = guestRooms().filter(r=>r.facility===fac);
    ROOMMAP[tag] = {facility:fac, room: gr.length===1 ? gr[0].room : tag.replace(/^\D+/,''), ext:false, daiko:!!info.daiko, order:info.order||0};
  });
}
function feedChar(tag, day, key){
  const m = V.months[day.slice(0,7)]; if(!m || !m[tag]) return '';
  return String(m[tag][key]||'').charAt(+day.slice(8,10)-1);
}
function tagOf(f, r){ return Object.keys(ROOMMAP).find(k=>ROOMMAP[k].facility===f && ROOMMAP[k].room===r && !ROOMMAP[k].ext); }
function vacOf(f, r, day){
  const tag = tagOf(f, r); if(!tag) return '';
  const c = feedChar(tag, day, 'stay');
  return (c==='-'||c==='O'||c==='X') ? 'free' : (c==='I'||c==='B') ? 'inb' : c==='S' ? 'stay' : '';
}

/* ===================== 施工管理の判定（簡略版） ===================== */
const recs = () => (D.records||[]).filter(x=>!x.canceled);
function regTargets(g){ return g.room==='全室' ? guestRooms().filter(r=>!g.facility || g.facility==='全施設' || r.facility===g.facility) : [{facility:g.facility, room:g.room}]; }
// st: over=期限切れ / soon=3日以内 / todo=まだ / ok=済み・余裕あり
function regEval(g, rm, day){
  const done = recs().filter(x=>x.regularId===g.id && x.facility===rm.facility && x.room===rm.room && isYmd(x.doneDate)).map(x=>x.doneDate).sort();
  const last = done[done.length-1] || '';
  const m = String(g.freq).match(/(\d+)\s*(週間|日)/);
  if(m){
    const due = last ? addDays(last, +m[1]*(m[2]==='週間'?7:1)) : '';
    if(!due || due<=day) return {st:'over', why: last?`期限 ${md(due)} 切れ`:'記録なし', last};
    if(due<=addDays(day,3)) return {st:'soon', why:`期限 ${md(due)}`, last};
    return {st:'ok', why:`次 ${md(due)}`, last};
  }
  if(g.freq==='毎月') return done.some(x=>x.slice(0,7)===day.slice(0,7)) ? {st:'ok', why:'今月済み', last} : {st:'todo', why:'今月まだ', last};

/* ===================== 清掃ログ ===================== */
// 「一緒に清掃した担当者を追加」— 名前と役割は 2026-11-13 の清掃ログ画面より（後半の役割は未確認）
const STAFF_ROLES = [['近藤','admin'],['大原','admin'],['矢崎','admin'],['藤原','manager'],['西川原','manager'],['友利','manager']];   // チェッカー・クリーナーは 2026-11-25 にいったん外した
const ROLE_NM = {admin:['管理者','Admin'], manager:['マネージャー','Manager'], checker:['チェッカー','Checker'], cleaner:['クリーナー','Cleaner']};
/* ---- 予定（清掃カレンダー）— 担当・清掃完了は試作ではこのブラウザだけで仮に付けられる ---- */
function yList(day){
  return Object.keys(ROOMMAP).map(tag=>({tag, r:ROOMMAP[tag], c:feedChar(tag,day,'clean'), s:feedChar(tag,day,'stay')}))
    .filter(x=>x.c==='C'||x.c==='c').sort((a,b)=>a.r.order-b.r.order);
}
// 次のIN：同日入替なら当日、そうでなければ空室データから次のINを探す
function yNextIn(tag, day){
  if(ckStay(tag, day)==='B' || ckStay(tag, day)==='I') return day;
  for(let i=1;i<=60;i++){ const d = addDays(day, i), s = ckStay(tag, d); if(s==='I'||s==='B') return d; if(s==='') return ''; }
  return '';
}
/* ---- 写真（ギャラリー）：施設 → 清掃（日付・部屋）→ 清掃前／清掃後 → 写真 ---- */
/* ---- リネン（需要予測）：搬入日ごとに「次の搬入までの清掃件数」と必要枚数 ----
   清掃件数は空室フィード（AirHost清掃予定）から本物で数える。部屋ごとのベッド構成・人数は清掃ログ側にあるので、枚数は本番で出す */
/* ---- 通知：試作では「チェック報告の送信＆通知」と「満点レビューの登録」で、担当クリーナー宛ての通知を出す（担当が未割当なら届かない） ---- */
/* ---- 管理（データ管理）：清掃画像・チェック履歴の件数と整理、満点評価レビューの登録 ---- */
/* 満点評価レビューの詳細（清掃ログと同じ見た目）：通知の文面もここと同じ */
/* チェック報告（予定から作る）：入力 → プレビュー → 送信＆通知 */
/* ---- チェック（空室チェック表・チェック報告）— 試作の記録はこのブラウザだけに保存 ---- */
const ckStay = (tag, d) => feedChar(tag, d, 'stay');

/* ---- 工事・定期メンテの追加／変更／削除（季節でやることが変わるので）
   試作ではこのブラウザだけに保存し、本番のデータ（施工管理のシート）は変えない。本番では施工管理の GAS に保存する ---- */
let D0 = null;   // 読み込んだままの本番データ（試作の変更を重ねる前）
const edStore = k => (store[k] = store[k] || {add:[], upd:{}, del:[]});
function edMerge(list, k){
  const e = edStore(k);
  return list.filter(x=>!e.del.includes(x.id)).map(x=> e.upd[x.id] ? Object.assign({}, x, e.upd[x.id], {_ed:'upd'}) : Object.assign({}, x))
    .concat(e.add.filter(x=>!e.del.includes(x.id)).map(x=>Object.assign({}, x, {_ed:'add'})));
}
function applyEdits(){
  if(!D0) D0 = {regular: (D.regular||[]).map(x=>Object.assign({}, x)), projects: (D.projects||[]).map(x=>Object.assign({}, x))};
  D.regular = edMerge(D0.regular, 'regEd');
  D.projects = edMerge(D0.projects, 'projEd');
}
function edSave(k, id, obj){
  const e = edStore(k);
  if(!id){ e.add.push(Object.assign({id:(k==='regEd'?'GL':'PL')+Date.now()}, obj)); }
  else if(e.add.some(x=>x.id===id)) Object.assign(e.add.find(x=>x.id===id), obj);
  else e.upd[id] = Object.assign(e.upd[id]||{}, obj);
  save(); applyEdits(); closeModal(); render();
}
function edDel(k, id, name){
  if(!confirm(`「${name}」を削除しますか？\n（試作なのでこのブラウザの中だけです。本番のデータは消えません）`)) return;
  const e = edStore(k); e.del.push(id); save(); applyEdits(); closeModal(); render();
}
function edReset(k){
  if(!confirm('試作で追加・変更・削除したものをすべて取り消して、本番のデータの状態に戻しますか？')) return;
  store[k] = {add:[], upd:{}, del:[]}; save(); applyEdits(); render();
}
const edBadge = x => x._ed==='add' ? '<span class="badge soon">試作で追加</span>' : x._ed==='upd' ? '<span class="badge soon">試作で変更</span>' : '';
const edNote = k => { const e = edStore(k), n = e.add.length + Object.keys(e.upd).length + e.del.length;
  return `<div class="notice">試作：追加・変更・削除はこのブラウザの中だけに保存します。本番の施工管理のデータは変わりません。${n?` 今 ${n}件 変えています。<button class="btn" style="margin-left:6px" onclick="edReset('${k}')">本番の状態に戻す</button>`:''}</div>`; };

  tb.innerHTML = `<input id="hq" placeholder="キーワード（空白区切りで全部含むもの）例：青戸 ペンキ" value="${esc(ui.q)}" style="flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--line);border-radius:8px">`;
  return `<div class="page"><div class="box" id="histRes">${histResults()}</div></div>`;

function histResults(){
  const ws = ui.q.split(/[\s　]+/).filter(Boolean);
  const list = recs().filter(x=>x.doneDate).filter(x=>{ const s = [x.facility,x.room,x.task,x.person,x.type,x.note].join(' '); return ws.every(w=>s.includes(w)); })
    .sort((a,b)=>dkey(b.doneDate).localeCompare(dkey(a.doneDate))).slice(0,100);
  return `<h2>履歴<span class="r">${list.length}件${list.length===100?'（最新100件）':''}</span></h2>` + (list.map(x=>recRow(x, md(x.doneDate))).join('') || '<div class="row muted">見つかりません</div>');
}

/* ===================== 行動管理（Asana型ボード） ===================== */
// 行動管理のカードは「人の行動予定」だけ。清掃・施工の予定は「参考表示」をオンにしたときだけ点線で重ねる
function refCards(){
  const out = [];
  Object.keys(ROOMMAP).forEach(tag=>{ const r = ROOMMAP[tag];
    RANGE.forEach(day=>{ const c = feedChar(tag, day, 'clean'); if(c!=='C' && c!=='c') return;
      const s = feedChar(tag, day, 'stay');
      out.push({id:`clean:${tag}:${day}`, ref:true, kind:'clean', date:day, facility:r.facility, room:r.room, title:`${r.facility} ${r.room}`, sub:'清掃（清掃ログ）', members:[], tags:[(s==='B'||s==='I')?'★当日イン':'', r.ext?'外部':''].filter(Boolean)}); });
  });
  recs().forEach(rec=>{
    if(rec.doneDate || !rec.planStart) return;
    for(let d=rec.planStart, n=0; d<=(rec.planEnd||rec.planStart) && n<60; d=addDays(d,1), n++){
      if(RANGE.includes(d)) out.push({id:`plan:${rec.id}:${d}`, ref:true, kind:rec.regularId?'teiki':'sekou', date:d, facility:rec.facility, room:rec.room, title:`${rec.facility} ${rec.room}`, sub:`${rec.task}（施工管理）`, members:splitPeople(rec.person), tags:[]});
    }
  });
  return out;
}
function actCards(){ return store.local.map(c=>Object.assign({}, c)); }
function boardCards(){ return actCards().concat(ui.ref ? refCards() : []); }
function members(){ return (store.members || uniq((D.members||[]).concat(CLEAN_STAFF, recs().flatMap(r=>splitPeople(r.person))))).filter(m=>!HIDDEN_STAFF.includes(m)); }
function visible(c){
  if(!ui.kinds[c.kind]) return false;
  if(ui.who==='__none') return !(c.members||[]).length;
  if(ui.who) return (c.members||[]).includes(ui.who);
  return true;
}
// 人ごとの色（行動管理のタスクと名前）。決まっていない人はグレー
const PERSON_COLOR = {"近藤":"#2f6fd6", "大原":"#e8762c", "矢崎":"#2e9d5b"};
const pcol = m => PERSON_COLOR[m] || "#8a94a6";
const pav = m => `<span class="av pc l${Math.min(4, [...String(m)].length)}" style="background:${pcol(m)}" title="${esc(m)}">${esc(m)}</span>`;
function cardHtml(c){
  const mem = (c.members||[]).length ? c.members.map(pav).join('') : `<span class="av none l3">未割当</span>`;
  const tags = (c.tags||[]).map(t=>`<span class="tag ${t.includes('当日イン')?'in':''}">${esc(t)}</span>`).join('');
  // コンパクト：左に担当、右に「場所」と「種類・やること」を2行で
  return `<div class="card k-${c.kind} ${c.done?'done':''} ${c.ref?'ref':''}" style="--k:${(c.members||[]).length?pcol(c.members[0]):'#c4c9d2'}" ${c.ref?'':`draggable="true" onclick="openCard('${esc(c.id)}')"`} data-id="${esc(c.id)}">
    <div class="cw">${mem}</div>
    <div class="cm"><div class="t">${esc(c.title)}${tags}</div>
    <div class="s"><span class="kind">${esc(KIND[c.kind])}${c.done?'・完了':''}${c.ref?'・参考':''}</span>${c.sub?` ${esc(c.sub)}`:''}</div></div></div>`;
}
function pendingByRoom(day){
  const res = {}, push = (f, r, it) => (res[f+'|'+r] = res[f+'|'+r]||[]).push(it);
  const planned = new Set(actCards().concat(refCards()).filter(c=>!c.done && c.date>=today()).map(c=>`${c.facility}|${c.room}|${String(c.sub).replace(/（.*）$/,'')}`));
  (D.regular||[]).filter(g=>!g.stopped).forEach(g=> regTargets(g).forEach(rm=>{
    if(planned.has(`${rm.facility}|${rm.room}|${g.task}`)) return;
    const e = regEval(g, rm, day);
    if(e.st!=='ok') push(rm.facility, rm.room, {label:g.task, regId:g.id, kind:'teiki', st:e.st, warn:e.st==='over', why:e.why, last:e.last||'', avoidIn:/当日イン/.test(g.caution||''), caution:g.caution||''});
  }));
  (D.projects||[]).filter(p=>p.status==='進行中').forEach(p=> projRooms(p).forEach(r=>{
    if(r.left.length && !r.plan) push(p.facility, r.room, {label:r.left.join('・'), kind:'sekou', why:p.name, last:''});
  }));
  recs().filter(x=>!x.doneDate && !x.planStart).forEach(x=> push(x.facility, x.room, {label:x.task, kind:'sekou', why:'日付未定', last:lastDoneOf(x.facility, x.room, x.task, x.regularId)}));
  return res;
}
function suggestions(day){
  const pend = pendingByRoom(day), list = [];
  (D.rooms||[]).forEach(rm=>{
    const items = pend[rm.facility+'|'+rm.room]; if(!items) return;
    const v = rm.room==='事務所' ? 'free' : vacOf(rm.facility, rm.room, day);
    if(v!=='free' && v!=='inb') return;
    const ok = items.filter(it=>!(v==='inb' && it.avoidIn));
    if(ok.length) list.push({facility:rm.facility, room:rm.room, vac:v, items:ok});
  });
  return list.sort((a,b)=> (a.vac===b.vac?0:a.vac==='free'?-1:1));
}
function sugHtml(day){
  if(day<today()) return '';
  const s = suggestions(day); if(!s.length) return '';
  return `<details class="sug" open><summary>💡 ${T('作業可能タスク','Workable tasks')}（${s.length}室）</summary><ul>${s.map(x=>{ const p = x.room==='事務所' ? null : vacPeriodAt(x.facility, x.room, day); return `<li><span class="room">${esc(rmName(x.facility, x.room))}</span> ${p?`<span class="vp">${esc(fmtPeriod(p))}</span>`:`<em class="band ${x.vac}">${x.vac==='free'?'終日空き':'IN前'}</em>`}<br>${
    x.items.map(it=>`<button class="opt ${it.warn?'warn':''}" title="${esc(it.why+(it.caution?'／'+it.caution:''))}" onclick="addFromSug(${jsq({day, facility:x.facility, room:x.room, kind:it.kind, sub:it.label})})">＋ ${esc(it.label)}　<small>${it.last?T('前回','last')+md(it.last):T('前回なし','no record')}</small></button>`).join('')}</li>`;}).join('')}</ul></details>`;
}

      : `<select onchange="ui.who=this.value;render()" style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;max-width:45%"><option value="">全員</option>${members().map(m=>`<option ${ui.who===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="__none" ${ui.who==='__none'?'selected':''}>未割当</option></select>
         <button class="btn" onclick="scrollToday()">今日へ</button><label class="muted" style="margin-left:auto"><input type="checkbox" ${ui.ref?'checked':''} onchange="ui.ref=this.checked;render()"> 清掃・施工も表示</label>`;

  }

    <button class="btn" onclick="scrollToday()">今日へ</button>
    ${meOnly ? `<span class="muted">👤 ${store.me?esc(store.me):'未設定'}</span><button class="btn" onclick="openMe()">${store.me?'変える':'自分を選ぶ'}</button>` :
      `<span class="muted">だれ</span><select class="btn" onchange="ui.who=this.value;render()"><option value="">全員</option>${members().map(m=>`<option ${ui.who===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="__none" ${ui.who==='__none'?'selected':''}>未割当</option></select>`}
    <label class="chip ${ui.ref?'on':''}" style="cursor:pointer"><input type="checkbox" ${ui.ref?'checked':''} onchange="ui.ref=this.checked;render()" style="margin:0 4px 0 0;vertical-align:-1px">清掃・施工の予定を参考に重ねる</label>
    <span style="margin-left:auto"></span>
    ${meOnly?'':`<button class="btn" onclick="openMembers()">メンバー</button>`}<button class="btn danger" onclick="resetProto()">試作データを消す</button>`;
}
function actBoard(tb){
  actToolbar(tb, false);
  document.getElementById('fab').style.visibility = '';
  const cards = boardCards().filter(visible);
  return isSP() ? mobileHtml(cards, false) : boardHtml(cards);
}
function actMe(tb){
  if(!store.me){ actToolbar(tb, true); return `<div class="page"><div class="mock"><h3>自分の予定</h3><p class="muted">本番ではログインした人の予定が自動で出ます。試作では先に「自分を選ぶ」で名前を選んでください。</p><button class="btn primary" onclick="openMe()">自分を選ぶ</button></div></div>`; }
  actToolbar(tb, true);
  document.getElementById('fab').style.visibility = '';
  const keep = ui.who; ui.who = store.me;
  const cards = boardCards().filter(visible); ui.who = keep;
  return isSP() ? mobileHtml(cards, true) : boardHtml(cards, true);
}
const TANTO = ['近藤','大原','矢崎'];   // 担当の並び順。ダッシュボードの「担当」「報告の担当」もこの3人だけ
const ORDER = c => { const ms = c.members||[], rk = ms.length ? Math.min(...ms.map(m=>{ const i = TANTO.indexOf(m); return i<0 ? TANTO.length : i; })) : TANTO.length+1;
  return (c.ref?100000:0) + rk*1000 + (ms.length>1?100:0) + (c.done?10:0) + ({sekou:0,teiki:1,check:2,clean:3,naikin:4,other:5}[c.kind] || 0); };
// 日付の横に出す「清掃：5　パート：2」。清掃＝空室フィードの清掃予定の件数（本番を読むだけ）
// パートの人数は読める元データがまだないので、数字を押して手で入れる（この端末に保存：store.part）
const cleanCount = day => Object.keys(ROOMMAP).filter(tag=>/[Cc]/.test(feedChar(tag, day, 'clean'))).length;
function setPart(day){
  const cur = (store.part||{})[day], v = window.prompt(`${mdw(day)} のパートの人数`, cur==null ? '' : cur); if(v===null) return;
  store.part = store.part || {}; const n = parseInt(v, 10);
  if(v.trim()==='' || isNaN(n)) delete store.part[day]; else store.part[day] = Math.max(0, n);
  save(); render();
}
const dayNums = day => { const p = (store.part||{})[day]; return `<span class="dn">清掃：${cleanCount(day)}　<button onclick="event.stopPropagation();setPart('${day}')" title="押して人数を入れる">パート：${p==null?'—':p}</button></span>`; };
function boardHtml(cards, meOnly){
  const byDay = {}; cards.forEach(c=> (byDay[c.date] = byDay[c.date]||[]).push(c));
  const t = today();
  if(ui.mode==='lane' && !meOnly){
    const ms = members(), rows = ui.who==='__none' ? ['__none'] : ui.who ? [ui.who] : ms.concat(['__none']);
    return `<div class="lanes" id="scroller"><table><thead><tr><th class="who">メンバー</th>${RANGE.map(day=>`<th class="${day===t?'today':''}" data-day="${day}">${mdw(day)}${dayNums(day)}</th>`).join('')}</tr></thead><tbody>${
      rows.map(m=>`<tr><th class="who">${m==='__none'?'<span class="av none">未割当</span>':pav(m)}</th>${RANGE.map(day=>{
        const list = (byDay[day]||[]).filter(c=> m==='__none' ? !(c.members||[]).length : (c.members||[]).includes(m)).sort((a,b)=>ORDER(a)-ORDER(b));
        return `<td class="cell ${day===t?'today':''}" data-drop="${day}" data-who="${esc(m)}">${list.map(cardHtml).join('')}<button class="addbtn cadd" onclick="openNew('${day}',${jsq(m==='__none'?'':m)})">＋ タスクを追加</button></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="board" id="scroller">${RANGE.map(day=>{
    const list = (byDay[day]||[]).sort((a,b)=>ORDER(a)-ORDER(b)), w = wd(day), mine = list.filter(c=>!c.ref).length;
    return `<section class="col ${day===t?'today':''} ${day<t?'past':''}" data-day="${day}">
      <div class="colhead"><div class="d">${md(day)}<span class="w ${w===0?'sun':w===6?'sat':''}">${WD[w]}${day===t?'・今日':''}</span>${dayNums(day)}</div></div>
      <div class="cards" data-drop="${day}">${list.map(cardHtml).join('')}</div>
      <button class="addbtn" onclick="openNew('${day}')">＋ タスクを追加</button>
    </section>`;}).join('')}</div>`;
}
// スマホ：全日を縦に並べ、上下スクロールだけで日を移動する。上の日付の帯は「今見ている日」に合わせて動き、押すとその日へ飛ぶ
function mobileHtml(cards, meOnly){
  const t = today(), cnt = {}, byDay = {};
  cards.filter(c=>!c.ref).forEach(c=> cnt[c.date] = (cnt[c.date]||0) + 1);
  cards.forEach(c=> (byDay[c.date] = byDay[c.date]||[]).push(c));
  return `<div class="mstrip" id="mstrip">${RANGE.map(d=>{ const w = wd(d);
      return `<button class="mday ${d===ui.day?'on':''} ${d===t?'today':''} ${w===0?'sun':w===6?'sat':''}" data-sday="${d}" onclick="jumpDay('${d}')">${WD[w]}${d===t?'・今日':''}<b>${+d.slice(8,10)}</b></button>`;}).join('')}</div>
    <div class="mdays" id="mdays">${RANGE.map(d=>{ const w = wd(d), list = (byDay[d]||[]).sort((a,b)=>ORDER(a)-ORDER(b));
      return `<section class="mdsec ${d===t?'today':''} ${d<t?'past':''}" data-mday="${d}">
        <div class="mdh"><span class="d">${md(d)}</span><span class="w ${w===0?'sun':w===6?'sat':''}">${WD[w]}</span>${d===t?'<span class="tg">今日</span>':''}${dayNums(d)}<span class="n">${cnt[d]?cnt[d]+'件':''}</span></div>
        <div class="mlist">${list.map(cardHtml).join('')}<button class="addbtn madd" onclick="openNew('${d}')">＋ タスクを追加</button></div>
      </section>`;}).join('')}</div>`;
}
const spOffset = () => { const top = document.querySelector('.top'), st = document.getElementById('mstrip');
  return (top ? top.offsetHeight : 0) + (st ? st.offsetHeight : 0); };
function jumpDay(d, smooth){
  const sec = document.querySelector(`.mdsec[data-mday="${d}"]`); if(!sec) return;
  ui.day = d; markStrip(d);
  window.scrollTo({top: sec.getBoundingClientRect().top + window.scrollY - spOffset() + 1, behavior: smooth===false ? 'auto' : 'smooth'});
}
function markStrip(d){
  const strip = document.getElementById('mstrip'); if(!strip) return;
  strip.querySelectorAll('.mday.on').forEach(b=>b.classList.remove('on'));
  const on = strip.querySelector(`[data-sday="${d}"]`); if(!on) return;
  on.classList.add('on');
  strip.scrollTo({left: on.offsetLeft - strip.clientWidth/2 + on.offsetWidth/2});
}
// スクロールに合わせて「今見ている日」を決める
function spyDays(){
  if(!document.getElementById('mdays')) return;
  const y = spOffset() + 8; let cur = null;
  document.querySelectorAll('.mdsec').forEach(s=>{ if(s.getBoundingClientRect().top <= y) cur = s.dataset.mday; });
  cur = cur || RANGE[0];
  if(cur !== ui.day){ ui.day = cur; markStrip(cur); }
}
let spyTick = false;
window.addEventListener('scroll', ()=>{ if(spyTick) return; spyTick = true; setTimeout(()=>{ spyTick = false; spyDays(); }, 60); }, {passive:true});
function scrollToday(){
  if(isSP() && document.getElementById('mdays')) return jumpDay(today(), false);
  const sc = document.getElementById('scroller'); if(!sc) return;
  const el = sc.querySelector(`[data-day="${today()}"]`); if(!el) return;
  sc.scrollLeft = Math.max(0, el.offsetLeft - sc.offsetLeft - (ui.mode==='lane'?110:16) - 20);
}
function afterBoard(){
  // スマホ：日付の帯を画面上部に固定し、選んでいる日の位置まで縦にスクロール
  const top = document.querySelector('.top'), strip = document.getElementById('mstrip');
  if(strip){
    document.documentElement.style.setProperty('--toph', (top ? top.offsetHeight : 0) + 'px');
    document.documentElement.style.setProperty('--striph', strip.offsetHeight + 'px');
    jumpDay(ui.day, false);
  }
  // PC：ドラッグで日付・担当を動かす
  document.querySelectorAll('.card[draggable]').forEach(el=> el.addEventListener('dragstart', e=>{
    const cell = el.closest('[data-who]');
    e.dataTransfer.setData('text/plain', JSON.stringify({id:el.dataset.id, from: cell ? cell.dataset.who : null}));
  }));
  document.querySelectorAll('[data-drop]').forEach(z=>{
    z.addEventListener('dragover', e=>{ e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', ()=> z.classList.remove('over'));
    z.addEventListener('drop', e=>{
      e.preventDefault(); z.classList.remove('over');
      let p; try { p = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(_){ return; }
      const c = store.local.find(x=>x.id===p.id); if(!c) return;
      c.date = z.dataset.drop;
      if(z.dataset.who !== undefined && p.from !== null && z.dataset.who !== p.from){
        c.members = (c.members||[]).filter(m=>m!==p.from);
        if(z.dataset.who!=='__none' && !c.members.includes(z.dataset.who)) c.members.push(z.dataset.who);
      }
      save(); render();
    });
  });
}

/* ---- 自動メッセージ（毎日17時に Chatwork へ。送信アカウント：システム自動送信（lvnv））
   試作では文面を作って見せるだけ。本番は GAS の時間トリガーで送る。APIトークンはスクリプトプロパティに置き、このファイルには書かない ---- */
const AUTO_MSG = [
  {key:'vac', name:'空き部屋・施工情報', room:'施工関連', make:day=>msgVacancy(day)},
  {key:'act', name:'行動予定', room:'業務連絡', make:day=>msgActs(day)},

const msgHead = day => `${day===addDays(today(),1)?'明日 ':''}${md(day)}（${WD[wd(day)]}）`;
// ●空き（インあり）＝その日にチェックインがある（IN前なら入れる）／○空き（インなし）＝終日空き
function msgVacancy(day){
  const pend = pendingByRoom(day), blocks = [];
  const state = it => it.kind!=='teiki' ? '' : it.st==='over' ? '期限切れ' : it.st==='soon' ? 'もう直ぐ期限' : /^\d+\/\d+まで$/.test(it.why) ? '~'+it.why.replace('まで','') : it.why;
  guestRooms().forEach(rm=>{
    const v = vacOf(rm.facility, rm.room, day); if(v!=='free' && v!=='inb') return;
    let items = pend[rm.facility+'|'+rm.room] || [];
    if(v==='inb') items = items.filter(it=>!it.avoidIn);           // 当日インを避ける作業はインありの日は出さない
    if(v==='inb' && !items.length) return;                           // インありで作業もない部屋は省く
    const seen = new Set(), parts = [];   // 工事の残りと「ToDoリスト」で同じ作業が重なるので1つにまとめる
    items.forEach(it=>{ const s = state(it); String(it.label).split('・').forEach(lb=>{ lb = lb.trim(); if(lb && !seen.has(lb)){ seen.add(lb); parts.push(lb + (s?`（${s}）`:'')); } }); });
    const txt = parts.length ? parts.join('、') : '定期作業なし、空室チェック';
    const one = guestRooms().filter(r=>r.facility===rm.facility).length===1;   // 一棟貸しは部屋番号なし
    blocks.push(`${v==='inb'?'●':'○'}${rm.facility}${one?'':' '+rm.room}\n　${txt}`);
  });
  return [msgHead(day), '●空き（インあり）　○空き（インなし）　', ''].concat(blocks.length ? blocks.join('\n\n') : '作業できる空き部屋はありません').join('\n');
}
function msgActs(day){
  const cl = yList(day), cards = actCards().filter(c=>c.date===day && !c.done);
  const txt = c => uniq([c.title, c.sub].filter(Boolean)).join(' ');
  const people = uniq(['近藤','大原','矢崎'].concat(cards.flatMap(c=>c.members||[])));
  const L = [msgHead(day), '', `・清掃${cl.length}件`, `・当日イン${cl.filter(x=>x.s==='B'||x.s==='I').length}件`, ''];
  people.forEach(p=>{ const mine = cards.filter(c=>(c.members||[]).includes(p)); L.push(`◼︎${p}`, ...(mine.length ? mine.map(c=>'・'+txt(c)) : ['・予定なし']), ''); });
  const un = cards.filter(c=>!(c.members||[]).length);
  if(un.length) L.push('◼︎未割当', ...un.map(c=>'・'+txt(c)), '');
  return L.join('\n').replace(/\n+$/,'');

/* ===================== ホーム：ダッシュボード（2026-11-16 追加） =====================
   縦＝部屋、横＝その部屋のタスク（カード）。空室状況・次のIN・優先度をひと目で。
   データ源：空室フィード（stay）／施工管理（定期メンテの期限・工事の予定）／行動管理（この端末のカード）
   優先度：自動計算（期限切れ・今日・IN前に済ませたい＝高、3日以内＝中、それ以外＝低）。カードの優先度チップを押すと手で上書き（この端末に保存） */
ui.dash = {view:'rows', fac:'', freeOnly:false, hiOnly:false};
const dpriOf = (id, auto) => (store.dpri||{})[id] || auto;
function autoPri(t, day){
  if(t.over) return 1;
  if(t.due && isYmd(t.due)){ if(t.due<=day) return 1; if(t.due<=addDays(day,3)) return 2; return 3; }
  if(t.st==='soon') return 2;
  return 3;
}
// 部屋ごとのタスク一覧を組み立てる
function dashRooms(day, vday){
  vday = vday || day;
  const pend = pendingByRoom(day), out = [];
  guestRooms().forEach(rm=>{   // 事務所は出さない
    const key = rm.facility+'|'+rm.room, tag = tagOf(rm.facility, rm.room);
    const vac = rm.room==='事務所' ? 'office' : vacOf(rm.facility, rm.room, vday);
    const nextIn = tag ? yNextIn(tag, vday) : '';
    let nextFree = ''; if(tag){ for(let i=0;i<40;i++){ const d = addDays(vday,i); if(vacOf(rm.facility, rm.room, d)==='free'){ nextFree = d; break; } } }
    const tasks = [];
    // 定期メンテの期限・進行中の工事で残っている項目（施工管理）
    (pend[key]||[]).forEach((it,i)=>{
      const mdue = String(it.why||'').match(/期限 (\d+)\/(\d+)/);
      const due = mdue ? `${day.slice(0,4)}-${String(mdue[1]).padStart(2,'0')}-${String(mdue[2]).padStart(2,'0')}` : '';
      tasks.push({id:`pend:${key}:${it.kind}:${it.label}`, f:rm.facility, r:rm.room, regId:it.regId||'', kind:it.kind, label:it.label, due, dueText:it.why||'', last:it.last||'', over:it.st==='over', st:it.st, who:[], src:it.kind==='teiki'?'定期メンテ':'工事', caution:it.caution||'', avoidIn:it.avoidIn});
    });
    // 日付の決まった工事・修繕（施工管理の記録）
    recs().filter(x=>!x.doneDate && x.planStart && x.facility===rm.facility && x.room===rm.room).forEach(x=>{
      const due = x.planEnd||x.planStart;
      tasks.push({id:`rec:${x.id}`, f:rm.facility, r:rm.room, regId:x.regularId||'', kind:x.regularId?'teiki':'sekou', label:x.task, due, dueText:x.planEnd&&x.planEnd!==x.planStart?`${md(x.planStart)}〜${md(x.planEnd)}`:md(x.planStart), last:lastDoneOf(rm.facility, rm.room, x.task, x.regularId), over:due<day, who:splitPeople(x.person), src:'施工管理'});
    });
    // 行動管理のカード（この端末）
    actCards().filter(c=>!c.done && c.facility===rm.facility && c.room===rm.room).forEach(c=>{
      tasks.push({id:c.id, f:rm.facility, r:rm.room, regId:'', kind:c.kind, label:c.sub||KIND[c.kind], due:c.date, dueText:mdw(c.date), last:lastDoneOf(rm.facility, rm.room, c.sub), over:c.date<day, who:c.members||[], src:'行動管理', local:true, tid:c.tid||''});
    });
    tasks.forEach(t=>{ t.auto = autoPri(t, day); t.pri = dpriOf(t.id, t.auto); });
    tasks.sort((a,b)=> a.pri-b.pri || dkey(a.due||'9999').localeCompare(dkey(b.due||'9999')));
    const ft = facTaskCards(rm, key, tasks);   // 作業リストがある施設は、カードをそのリストに差し替える
    if(ft){ ft.forEach(t=>{ t.auto = t.auto || t.pri; t.pri = dpriOf(t.id, t.auto); }); out.push({rm, key, vac, nextIn, nextFree, tasks:ft, hist:[], top: ft.length ? Math.min(...ft.map(t=>t.pri)) : 9}); return; }
    out.push({rm, key, vac, nextIn, nextFree, tasks, hist: pastCards(rm, key, tasks), top: tasks.length ? tasks[0].pri : 9});
  });
  return out;
}
// 直近の空室期間：OUTの日（または今日）から次のINの日まで。最大 n 件
async function vacPeriods(f, r, n){
  const tag = tagOf(f, r); if(!tag) return [];
  const t = today(), out = [];
  for(let i=0;i<=120;i++) await ensureMonth(addDays(t,i).slice(0,7));
  const st = d => feedChar(tag, d, 'stay');
  // 今日すでに空いていれば、その期間の始まり（直前のOUT）までさかのぼる
  let d = t, start = '';
  if(st(t)==='-'||st(t)==='X'||st(t)==='O'){ start = t; for(let i=1;i<=30;i++){ const b = addDays(t,-i), c = st(b); if(c==='O'||c==='B'){ start = b; break; } if(c!=='-'&&c!=='X'){ break; } } }
  for(let i=0;i<=120 && out.length<n;i++){
    d = addDays(t,i); const c = st(d);
    if(c===''){ break; }                                   // データなし
    if(!start && (c==='O'||c==='B')) start = d;           // OUT → 空室期間の始まり
    if(start && (c==='I'||c==='B') && d!==start){ out.push({start, end:d}); start = c==='B' ? d : ''; }
  }
  if(start && out.length<n) out.push({start, end:''});   // INが決まっていない（開きっぱなし）
  return out;
}

// 「ダイニング 洗った／寝室1 洗浄不要（…）」→ 記録の備考の1行目（今の施工管理と同じ書き方）
function acSummary(units, date){

    const sameDay = !u.result && date && u.lastDate===date && u.lastResult;
    const res = sameDay ? u.lastResult : acResult(u); if(!res) return;
    const why = sameDay ? (res==='洗浄不要' ? (u.lastNote||'') : '') : res==='洗った' ? '' : res==='洗えない' ? (u.why||u.reason||'') : (u.why||'');

    map[k].places.push((u.place||'エアコン').trim());

  const rank = {'洗った':0,'洗浄不要':1,'洗えない':2};
  return groups.sort((a,b)=>rank[a.res]-rank[b.res]).map(g=>g.places.join('・')+' '+g.res+(g.why?'（'+g.why+'）':'')).join('／');

function shrinkImg(file){

    const k = Math.min(1, 480/Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .6)); }; im.src = fr.result; }; fr.readAsDataURL(file); });

/* ---- 本番（施工管理の GAS）への保存：報告だけ。今の施工管理ページと同じ送り方（POST・二重登録よけの番号つき）
   使うのは upload（写真）と addRecord／completeRegular（完了記録）だけ。ほかの操作は送らない ---- */
async function gasPost(payload, retry){
  if(!payload.reqId) payload.reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  let j;
  try { const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify(payload)}); j = JSON.parse(await res.text()); }
  catch(e){ if(!retry) return gasPost(payload, true); throw new Error('通信できませんでした（電波のよい場所でもう一度）'); }
  if(!j.ok) throw new Error(j.error || '保存できませんでした');
  return j;

    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('画像を読み込めません')); };
    im.onload = ()=>{ const k = Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth*k); c.height = Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8).split(',')[1]); };
    im.src = url; });
}

  if((window._dashMeasure||[]).length){
    const m = document.createElement('div');
    m.className = 'dfstrip'; m.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;height:auto;overflow:visible;align-items:flex-start';
    m.innerHTML = window._dashMeasure.join(''); s.parentNode.appendChild(m);
    h = Math.max(h, ...[...m.children].map(x=>x.getBoundingClientRect().height)); m.remove();
  }
  // 横スクロールのバーと下の余白のぶんを足す（枠の高さにはそれも含まれるため）
  s.style.minHeight = h ? Math.ceil(h + (s.offsetHeight - s.clientHeight) + parseFloat(getComputedStyle(s).paddingBottom || 0)) + 'px' : '';
  s.scrollLeft = ui.dash.sl || 0;
  s.addEventListener('scroll', ()=>{ ui.dash.sl = s.scrollLeft; }, {passive:true});
}
const dashSort = rows => [...rows].sort((a,b)=> a.top-b.top || (a.vac==='free'?0:a.vac==='inb'?1:2)-(b.vac==='free'?0:b.vac==='inb'?1:2));
// 部屋の中のカードの並び：赤（ON・期限切れ）→ 黄（一部済み）→ 緑（済み）→ 白（まだ）。色つきのカードが下に残らないようにする
// 期限切れ（⚠ が付くもの）は全部赤にする：ここで決めた定期タスクの期限切れ／施工管理（本番）の定期メンテの期限切れ／予定日を過ぎた予定
const tOver = t => !!((tDue(t)||{}).over || t.over || (t.due && t.due<today()));
const tRank = t => { if(tOn(t.id)) return 0; if(tOver(t)) return 1; const st = cardProg(t).st; return st==='part' ? 2 : st==='done' ? 3 : 4; };
const dashCards = r => { const a = r.tasks.concat(showPast() ? r.hist||[] : []).map(t=>[t, tRank(t)]); return [0,1,2,3,4].flatMap(k=>a.filter(x=>x[1]===k).map(x=>x[0])); };
const dashLegend = () => '';   // 色・略称の説明は 2026-11-25 までに全部消した
// horiz＝施設のタブを横に並べ、開くと横に広がる（「横に部屋を並べる」のとき）
function facGroups(rows, inner, horiz){
  const open = store.dashOpen2 || {}, facs = FAC_TABS.concat(uniq(rows.map(r=>r.rm.facility)).filter(f=>!FAC_TABS.some(x=>x[0]===f)).map(f=>[f,f]));
  if(horiz) window._dashMeasure = [];   // 閉じている施設を開いたときの高さを測るため（afterDash で使う）
  return dashLegend() + (horiz ? '<div class="dfstrip">' : '') + facs.filter(([f])=>rows.some(r=>r.rm.facility===f)).map(([f, nm])=>{
    const rs = dashSort(rows.filter(r=>r.rm.facility===f)), hi = rs.filter(r=>r.top===1).length;
    const isOpen = open[f] !== false || !!ui.dash.fac;   // 最初は全施設を開いておく
    const head = `<button class="dfh" onclick="dashToggle(${jsq(f)})" aria-expanded="${isOpen}"><span class="ar">▸</span><b>${esc(nm)}</b><span class="muted">${rs.length}${T('室','rooms')}</span>${hi?`<em>${T('優先','High ')}${hi}</em>`:''}${(n=>n?`<em class="on">ON ${n}</em>`:'')(rs.flatMap(r=>r.tasks).filter(t=>tOn(t.id)).length)}</button>`;
    if(horiz && !isOpen) window._dashMeasure.push(`<section class="dfac open">${head}${inner(rs)}</section>`);
    return `<section class="dfac ${isOpen?'open':''}" data-f="${esc(f)}">${head}${isOpen ? inner(rs) : ''}</section>`; }).join('') + (horiz ? '</div>' : '');
}
const dashRoomHead = r => `<div class="rm" onclick="openRoomPop(${jsq(r.rm.facility)},${jsq(r.rm.room)})" title="${T('押すと空室期間・履歴','Tap for vacancies and history')}"><span class="no">${esc(rmName(r.rm.facility, r.rm.room))}</span>`;
function dashCols(rows){
  if(!rows.length) return `<div class="status">${T('該当する部屋がありません','No rooms')}</div>`;
  return facGroups(rows, rs=>`<div class="dcols">${rs.map(r=>`<div class="dcol p${r.top}" id="dr_${esc(r.key)}">${dashRoomHead(r)}${vacBand(r.vac)}</div>
    <div class="tk">${dashCards(r).map(t=>dcardHtml(t)).join('') || `<span class="none">${T('タスクなし','No tasks')}</span>`}</div></div>`).join('')}</div>`, true);
}
function dashRows(rows){
  if(!rows.length) return `<div class="status">${T('該当する部屋がありません','No rooms')}</div>`;
  return facGroups(rows, rs=>`<div class="drows">${rs.map(r=>`<div class="drow p${r.top}" id="dr_${esc(r.key)}">${dashRoomHead(r)}
      <div class="vac">${vacBand(r.vac)}</div></div>
    <div class="tk">${dashCards(r).map(t=>dcardHtml(t)).join('') || `<span class="none">${T('タスクなし','No tasks')}</span>`}</div></div>`).join('')}</div>`);
}
// タスク毎：施設名のかわりにタスク名（エアコン・壁紙 など）でまとめる。中は前回の日付が古い順（記録なしが一番上）
const taskGroupOf = t => t.item ? (t.item.fam ? t.short.split(' ').pop() : t.short) : t.label;
function dashByTask(rows){
  const g = {}, order = [];
  rows.forEach(r=> r.tasks.forEach(t=>{ const k = taskGroupOf(t); if(!g[k]){ g[k] = []; order.push(k); } g[k].push([t, r]); }));
  if(!order.length) return `<div class="status">${T('該当するタスクがありません','No tasks')}</div>`;
  // 「全施設」と同じ形：タスク名ごとに縦の列を横に並べる
  return dashLegend() + `<div class="dcols dtk">${order.map(k=>{
    const list = g[k].map((x,i)=>[x,i]).sort((a,b)=> dkey(a[0][0].last).localeCompare(dkey(b[0][0].last)) || a[1]-b[1]).map(x=>x[0]);
    const nOn = list.filter(([t])=>tOn(t.id)).length;
    const fqs = uniq(list.map(([t])=>{ const f = t.item && tFreq(t.item); return f ? freqText(f) : ''; })), fq = fqs.length===1 && fqs[0];
    return `<div class="dcol"><div class="rm th"><span class="no">${esc(k)}</span><span class="sub">${list.length}${T('件','')}${fq?'・'+fq:''}</span>${nOn?`<span class="ems"><em class="on">ON ${nOn}</em></span>`:''}</div>
      <div class="tk">${list.map(([t,r])=>dcardHtml(t, r)).join('')}</div></div>`; }).join('')}</div>`;
}
// 3) 施設マップ（部屋タイル）
function dashGrid(rows){
  const byFac = {}; rows.forEach(r=> (byFac[r.rm.facility] = byFac[r.rm.facility]||[]).push(r));
  return `<div class="dgrid">${Object.keys(byFac).map(f=>`<div class="fac"><h3>${esc(f)} <span class="muted">${byFac[f].filter(r=>r.vac==='free').length}/${byFac[f].filter(r=>r.vac!=='office').length} ${T('室 空き','vacant')}</span></h3><div class="tiles">${byFac[f].map(r=>{
    const c = [1,2,3].map(p=>r.tasks.filter(t=>t.pri===p).length);
    return `<div class="tile ${r.vac}" onclick="ui.dash.view='rows';ui.dash.fac=${jsq(r.rm.facility)};render();setTimeout(()=>{const e=document.getElementById('dr_${esc(r.key)}');e&&e.scrollIntoView({block:'center'})},0)">
      <div class="no">${esc(r.rm.room)}</div><div class="v">${vacBand(r.vac)}${r.nextIn?`<span class="muted"> IN ${md(r.nextIn)}</span>`:''}</div>
      <div class="cnt">${c[0]?`<span class="p1">高 ${c[0]}</span>`:''}${c[1]?`<span class="p2">中 ${c[1]}</span>`:''}${c[2]?`<span>低 ${c[2]}</span>`:''}${!r.tasks.length?`<span>—</span>`:''}</div></div>`;}).join('')}</div></div>`).join('')}</div>`;
}

window.matchMedia('(max-width:820px)').addEventListener('change', ()=>{ drawer(false); render(); scrollToday(); });
renderSide(); renderTop();
load().then(()=>{ route(); setTimeout(scrollToday, 30); }).catch(e=>{
  document.getElementById('main').innerHTML = `<div class="status err">本番データを読めませんでした：${esc(e.message||e)}<br>ネットにつながっているか確認して、開き直してください。</div>`;
  document.getElementById('src').textContent = '読み込み失敗';
});
